{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block page_heading %}Request Error{% endblock %}

{% block content %}
<div class="card text-center mx-auto" style="max-width: 560px;">
    <div class="card-body py-5">
        <i class="bi bi-exclamation-triangle text-warning fs-1"></i>
        <h2 class="mt-3">Error {{ code }}</h2>
        <p class="text-muted">{{ message }}</p>
        <a href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('login') }}" class="btn btn-primary">
            <i class="bi bi-arrow-left me-1"></i> Continue
        </a>
    </div>
</div>
{% endblock %}
