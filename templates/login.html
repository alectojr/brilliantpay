{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block auth_content %}
<div class="auth-wrapper" data-background-images='{{ [
    url_for("static", filename="img/login-background-1.jpg"),
    url_for("static", filename="img/login-background-2.jpg"),
    url_for("static", filename="img/login-background-3.jpg"),
    url_for("static", filename="img/login-background-4.jpg")
] | tojson }}'>
    <div class="auth-card">
        <div class="auth-header">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" class="auth-logo">
            <h4 class="auth-brand-title">BrilliantPay</h4>
            <p class="auth-brand-subtitle">Brilliant Driving School Finance Hub</p>
        </div>
        <div class="auth-body">
            <h5 class="auth-title">Sign in to your account</h5>
            <form method="POST" action="{{ url_for('login') }}" class="auth-form">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <div class="auth-field">
                    <label for="username">Username</label>
                    <div class="auth-input-group">
                        <span class="auth-input-icon" aria-hidden="true"><i class="bi bi-person"></i></span>
                        <input type="text" id="username" name="username" class="auth-input" placeholder="Enter username" autocomplete="username" required autofocus>
                    </div>
                </div>
                <div class="auth-field">
                    <label for="password">Password</label>
                    <div class="auth-input-group">
                        <span class="auth-input-icon" aria-hidden="true"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" name="password" class="auth-input" placeholder="Enter password" autocomplete="current-password" required>
                    </div>
                </div>
                <div class="auth-submit-wrap">
                    <button type="submit" class="auth-submit">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Login
                    </button>
                </div>
            </form>
            <div class="auth-links">
                <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
                <span aria-hidden="true">|</span>
                <a href="{{ url_for('signup') }}">Create staff account</a>
            </div>
        </div>
    </div>
    <button type="button" class="auth-background-control auth-background-previous"
            aria-label="Show previous background" disabled>
        <span aria-hidden="true">‹</span>
    </button>
    <button type="button" class="auth-background-control auth-background-next"
            aria-label="Show next background" disabled>
        <span aria-hidden="true">›</span>
    </button>
    <span class="visually-hidden background-slide-status" aria-live="polite"></span>
</div>
{% endblock %}
