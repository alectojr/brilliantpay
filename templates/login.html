{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block auth_content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo">
            <h4 class="mb-0 fw-bold">BrilliantPay</h4>
            <p class="mb-0 small opacity-75">Brilliant Driving School Finance Hub</p>
        </div>
        <div class="auth-body">
            <h5 class="mb-3 text-center text-primary-dark">Sign in to your account</h5>
            <form method="POST" action="{{ url_for('login') }}">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                    </div>
                </div>
                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Login
                    </button>
                </div>
            </form>
            <div class="text-center">
                <a href="{{ url_for('forgot_password') }}" class="text-decoration-none small">Forgot password?</a>
                <span class="mx-2 text-muted">|</span>
                <a href="{{ url_for('signup') }}" class="text-decoration-none small">Create staff account</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
