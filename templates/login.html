{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block auth_content %}
<div class="auth-wrapper" data-background-images='{{ [
    url_for("static", filename="img/login-background-1.jpg"),
    url_for("static", filename="img/login-background-2.jpg"),
    url_for("static", filename="img/login-background-3.jpg"),
    url_for("static", filename="img/login-background-4.jpg")
] | tojson }}'>
    <div class="auth-card">
        <div class="auth-header">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo">
            <h4 class="mb-0 fw-bold">BrilliantPay</h4>
            <p class="mb-0 small opacity-75">Brilliant Driving School Finance Hub</p>
        </div>
        <div class="auth-body">
            <h5 class="mb-3 text-center text-primary-dark">Sign in to your account</h5>
            <form method="POST" action="{{ url_for('login') }}">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                    </div>
                </div>
                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Login
                    </button>
                </div>
            </form>
            <div class="text-center">
                <a href="{{ url_for('forgot_password') }}" class="text-decoration-none small">Forgot password?</a>
                <span class="mx-2 text-muted">|</span>
                <a href="{{ url_for('signup') }}" class="text-decoration-none small">Create staff account</a>
            </div>
        </div>
    </div>
    <button type="button" class="auth-background-control auth-background-previous"
            aria-label="Show previous background" disabled>
        <i class="bi bi-chevron-left" aria-hidden="true"></i>
    </button>
    <button type="button" class="auth-background-control auth-background-next"
            aria-label="Show next background" disabled>
        <i class="bi bi-chevron-right" aria-hidden="true"></i>
    </button>
    <span class="visually-hidden" id="background-slide-status" aria-live="polite"></span>
</div>
{% endblock %}

{% block extra_js %}
<script>
    (() => {
        const wrapper = document.querySelector(".auth-wrapper[data-background-images]");
        if (!wrapper) return;

        const imageUrls = JSON.parse(wrapper.dataset.backgroundImages);
        Promise.all(imageUrls.map((url) => new Promise((resolve) => {
            const image = new Image();
            image.onload = () => resolve(url);
            image.onerror = () => resolve(null);
            image.src = url;
        }))).then((results) => {
            const availableImages = results.filter(Boolean);
            if (!availableImages.length) return;

            let currentIndex = 0;
            const controls = wrapper.querySelectorAll(".auth-background-control");
            const status = wrapper.querySelector("#background-slide-status");
            const showImage = (index) => {
                currentIndex = (index + availableImages.length) % availableImages.length;
                wrapper.style.setProperty(
                    "--auth-background-image",
                    `url("${availableImages[currentIndex]}")`
                );
                wrapper.classList.add("has-background-image");
                if (status) {
                    status.textContent = `Background ${currentIndex + 1} of ${availableImages.length}`;
                }
            };

            showImage(currentIndex);
            if (availableImages.length < 2) return;

            const [previousButton, nextButton] = controls;
            previousButton.disabled = false;
            nextButton.disabled = false;
            previousButton.addEventListener("click", () => showImage(currentIndex - 1));
            nextButton.addEventListener("click", () => showImage(currentIndex + 1));
            wrapper.addEventListener("keydown", (event) => {
                if (event.key === "ArrowLeft") {
                    showImage(currentIndex - 1);
                } else if (event.key === "ArrowRight") {
                    showImage(currentIndex + 1);
                }
            });
        });
    })();
</script>
{% endblock %}
