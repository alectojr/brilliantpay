{% extends "base.html" %}
{% block title %}Edit Payment{% endblock %}
{% block page_heading %}Edit Payment #{{ payment.id }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-pencil-square me-2"></i>Edit Payment Record
            </div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Student Name</label>
                            <input type="text" name="student_name" class="form-control" value="{{ payment.student_name }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Course</label>
                            <select name="course" class="form-select">
                                <option value="">No course selected</option>
                                {% for course, fee in course_fees.items() %}
                                <option value="{{ course }}" {% if payment.course == course %}selected{% endif %}>{{ course }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Form of Payment</label>
                            <select name="form_of_payment" class="form-select">
                                {% if payment.payment_category == 'bank' %}
                                    {% for bank in bank_payment_methods %}
                                    <option value="{{ bank }}" {% if payment.form_of_payment == bank %}selected{% endif %}>{{ bank }}</option>
                                    {% endfor %}
                                {% else %}
                                    <option value="M-Pesa" {% if payment.form_of_payment == 'M-Pesa' %}selected{% endif %}>M-Pesa</option>
                                    <option value="Tigo Pesa" {% if payment.form_of_payment == 'Tigo Pesa' %}selected{% endif %}>Tigo Pesa</option>
                                    <option value="Airtel Money" {% if payment.form_of_payment == 'Airtel Money' %}selected{% endif %}>Airtel Money</option>
                                    <option value="HaloPesa" {% if payment.form_of_payment == 'HaloPesa' %}selected{% endif %}>HaloPesa</option>
                                    <option value="Other Mobile" {% if payment.form_of_payment == 'Other Mobile' %}selected{% endif %}>Other Mobile</option>
                                {% endif %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Amount Received (TZS) <span class="text-muted small">cannot be changed</span></label>
                            <input type="text" class="form-control" value="{{ '{:,.2f}'.format(payment.amount) }}" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Payment Date <span class="text-muted small">cannot be changed</span></label>
                            <input type="text" class="form-control" value="{{ payment.payment_date.strftime('%d %b %Y') }}" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Reference</label>
                            <input type="text" name="reference" class="form-control" value="{{ payment.reference or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Replace Receipt (optional)</label>
                            <input type="file" name="receipt" class="form-control" accept="image/*">
                            {% if payment.receipt_filename %}
                            <div class="mt-2">
                                Current:
                                <a href="{{ url_for('uploaded_file', filename=payment.receipt_filename) }}" target="_blank">
                                    <img src="{{ url_for('uploaded_file', filename=payment.receipt_filename) }}" class="receipt-thumb ms-1" alt="Current">
                                </a>
                            </div>
                            {% endif %}
                        </div>
                        <div class="col-12">
                            <label class="form-label">Notes</label>
                            <textarea name="notes" class="form-control" rows="2">{{ payment.notes or '' }}</textarea>
                        </div>
                    </div>
                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i> Update Payment
                        </button>
                        <a href="{{ url_for('modify_payments') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
