{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}

{% block auth_content %}
<div class="auth-wrapper" data-background-images='{{ [
    url_for("static", filename="img/login-background-1.jpg"),
    url_for("static", filename="img/login-background-2.jpg"),
    url_for("static", filename="img/login-background-3.jpg"),
    url_for("static", filename="img/login-background-4.jpg")
] | tojson }}'>
    <div class="auth-card">
        <div class="auth-header">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo">
            <h4 class="mb-0 fw-bold">BrilliantPay</h4>
            <p class="mb-0 small opacity-75">Create a staff account</p>
        </div>
        <div class="auth-body">
            <form method="POST" action="{{ url_for('signup') }}">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" minlength="12" required>
                    <div class="form-text">
                        At least 12 characters and at least three of: lowercase, uppercase, number, symbol.
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control" minlength="12" required>
                </div>
                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="bi bi-person-plus me-1"></i> Create Account
                    </button>
                </div>
            </form>
            <div class="text-center">
                <a href="{{ url_for('login') }}" class="text-decoration-none small">Already have an account? Login</a>
            </div>
        </div>
    </div>
    <button type="button" class="auth-background-control auth-background-previous" aria-label="Show previous background" disabled>
        <span aria-hidden="true">‹</span>
    </button>
    <button type="button" class="auth-background-control auth-background-next" aria-label="Show next background" disabled>
        <span aria-hidden="true">›</span>
    </button>
    <span class="visually-hidden background-slide-status" aria-live="polite"></span>
</div>
{% endblock %}
