{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}

{% block auth_content %}
<div class="auth-wrapper" data-background-images='{{ [
    url_for("static", filename="img/login-background-1.jpg"),
    url_for("static", filename="img/login-background-2.jpg"),
    url_for("static", filename="img/login-background-3.jpg"),
    url_for("static", filename="img/login-background-4.jpg")
] | tojson }}'>
    <div class="auth-card">
        <div class="auth-header">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo">
            <h4 class="mb-0 fw-bold">BrilliantPay</h4>
            <p class="mb-0 small opacity-75">Reset your password</p>
        </div>
        <div class="auth-body">
            <div class="text-center">
                <i class="bi bi-key-fill text-primary" style="font-size:2.5rem;"></i>
                <p class="text-muted mt-3 mb-4">
                    Contact a super-user administrator to generate a temporary fruit-based password for your account.
                </p>
                <a href="{{ url_for('login') }}" class="btn btn-primary">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Back to Login
                </a>
            </div>
        </div>
    </div>
    <button type="button" class="auth-background-control auth-background-previous" aria-label="Show previous background" disabled>
        <span aria-hidden="true">‹</span>
    </button>
    <button type="button" class="auth-background-control auth-background-next" aria-label="Show next background" disabled>
        <span aria-hidden="true">›</span>
    </button>
    <span class="visually-hidden background-slide-status" aria-live="polite"></span>
</div>
{% endblock %}
