name: Weekly Render backup to Cloudflare R2

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-render-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out backup utility
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Install backup dependencies
        run: python -m pip install -r requirements-backup.txt

      - name: Back up database and receipt uploads to R2
        env:
          RENDER_DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
          RENDER_UPLOADS_BACKUP_URL: ${{ secrets.RENDER_UPLOADS_BACKUP_URL }}
          BRILLIANTPAY_BACKUP_TOKEN: ${{ secrets.BRILLIANTPAY_BACKUP_TOKEN }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/backup_to_r2.py
