services:
  - type: web
    name: brilliantpay
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: waitress-serve --listen=0.0.0.0:$PORT wsgi:app
    healthCheckPath: /healthz
    disk:
      name: receipt-storage
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: BRILLIANTPAY_ENV
        value: production
      - key: BRILLIANTPAY_SECRET_KEY
        generateValue: true
      - key: BRILLIANTPAY_DATABASE_URL
        fromDatabase:
          name: brilliantpay-db
          property: connectionString
      - key: BRILLIANTPAY_UPLOAD_FOLDER
        value: /var/data/uploads
      - key: BRILLIANTPAY_ADMIN_USERNAME
        sync: false
      - key: BRILLIANTPAY_ADMIN_EMAIL
        sync: false
      - key: BRILLIANTPAY_ADMIN_PASSWORD
        sync: false
      - key: BRILLIANTPAY_REVIEWER_USERNAME
        sync: false
      - key: BRILLIANTPAY_REVIEWER_EMAIL
        sync: false
      - key: BRILLIANTPAY_REVIEWER_PASSWORD
        sync: false
      - key: BRILLIANTPAY_ENTRY_USERNAME
        sync: false
      - key: BRILLIANTPAY_ENTRY_EMAIL
        sync: false
      - key: BRILLIANTPAY_ENTRY_PASSWORD
        sync: false

databases:
  - name: brilliantpay-db
    databaseName: brilliantpay
    user: brilliantpay
    plan: basic-256mb
    region: singapore
